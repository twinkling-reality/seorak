# Publishes the three public packages with npm provenance over trusted
# publishing. No secret: npm authenticates this workflow by OIDC, bound on
# npmjs.com for all three packages to twinkling-reality/seorak, this filename,
# and the npm-publish environment. Never add a token of any kind back.
#
# Two jobs on purpose. build runs npm ci, which executes lifecycle scripts from
# every transitive dependency, and it holds no id-token permission, so none of
# that code can mint an OIDC token. publish holds id-token: write but installs
# nothing and runs no third-party code at all: it uploads a tarball built by the
# other job. Do not merge them back into one job.
#
# Provenance and registry auth stay independent. Provenance needs GitHub Actions
# plus id-token: write plus --access public and never inspects how you
# authenticated, which is why 0.1.0 could carry it on 2026-08-10 while trusted
# publishing was still unbindable: npm refuses to bind a trusted publisher to a
# package that does not yet exist.
name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace to publish"
        required: true
        type: choice
        # Dependency order. @seorak/collector depends on @seorak/dashboard at an
        # exact 0.1.0 and on @seorak/types at ^0.1.0, so collector publishes last
        # or a registry install of it resolves nothing.
        options:
          - "@seorak/types"
          - "@seorak/dashboard"
          - "@seorak/collector"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No id-token here. This job runs untrusted dependency code.
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pack.outputs.name }}
      version: ${{ steps.pack.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Lifecycle scripts run during npm ci; do not leave a usable
          # GITHUB_TOKEN in .git/config for them to read.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Node 24, not 22. Trusted publishing needs npm >= 11.5.1 and no Node 22
          # release bundles npm 11.x (22.23.2 ships 10.9.8); 24.19.0 ships 11.17.0.
          node-version: "24"
          # No dependency cache in a release build: a poisoned cache entry would
          # be inside the tarball that provenance then attests to.
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Pack the workspace
        id: pack
        env:
          PKG: ${{ inputs.package }}
        run: |
          # npm pkg get --workspace returns {"<workspace>":{...}}, so parse the
          # JSON rather than stripping punctuation out of it.
          read -r name version <<<"$(node -e '
            const { execFileSync } = require("child_process");
            const raw = execFileSync("npm", ["pkg", "get", "name", "version", "--workspace", process.env.PKG], { encoding: "utf8" });
            const parsed = JSON.parse(raw);
            const entry = parsed[process.env.PKG] || parsed;
            console.log(entry.name + " " + entry.version);
          ')"
          mkdir -p dist-pack
          npm pack --workspace "${PKG}" --pack-destination dist-pack
          tarball="$(ls dist-pack)"
          test -n "${tarball}" || { echo "npm pack produced nothing"; exit 1; }
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          echo "packed ${name}@${version} as ${tarball}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: dist-pack/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This is the control that pins the ref, not the guard below. GitHub issues
    # the OIDC token only after the environment's branch policy admits the run,
    # so a run off main never obtains the environment and its token carries no
    # environment claim for npm to match.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # Defence in depth only. workflow_dispatch runs the copy of this file on
      # the dispatched branch, so a branch that deletes this step still runs,
      # and npm matches on workflow FILENAME rather than ref. The environment
      # above is what actually refuses a run off main.
      - name: Refuse to publish off main
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" \
            || { echo "publish only runs on main, got ${GITHUB_REF}"; exit 1; }
      # Deliberately no checkout and no npm ci. This job must not execute any
      # third-party code while it holds id-token: write.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Assert npm can do OIDC
        run: |
          npm_v="$(npm --version)"
          echo "npm ${npm_v}"
          node -e "const v=process.argv[1];const [a,b]=v.split('.').map(Number);if(a<11||(a===11&&b<5))throw new Error('npm >= 11.5 required for OIDC, got '+v)" "${npm_v}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: dist-pack
      - name: Refuse to republish an existing version
        env:
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "PROBE3: ${NAME}@${VERSION} already published; EPUBLISHCONFLICT means the split-job tarball publish authenticated"
          fi
          echo "${NAME}@${VERSION} is not on the registry yet"
      - name: Publish with provenance
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "dist-pack/${TARBALL}" --access public --provenance
