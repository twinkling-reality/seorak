# Publishes the three public packages with npm provenance via trusted publishing.
# Bound on npmjs.com to this repository after C3 create. Do not add a classic token.
name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Workspace to publish"
        required: true
        type: choice
        options:
          - "@seorak/types"
          - "@seorak/collector"
          - "@seorak/dashboard"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Publish with provenance
        run: npm publish --workspace "${{ inputs.package }}" --access public --provenance
